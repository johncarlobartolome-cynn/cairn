name: cairn
description: "An offline hiking log. Holds a curated list of peaks, records a climb with its date, notes and photos, and unlocks a badge for it."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.0.1+2

environment:
  sdk: ^3.12.2

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  go_router: ^17.3.0
  drift: ^2.34.3
  drift_flutter: ^0.3.1
  path_provider: ^2.1.6
  image_picker: ^1.2.3
  share_plus: ^13.3.0
  image: ^4.9.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Drives the screenshot harness in tool/screenshots.sh: it runs the real app on
  # a device through `flutter drive`. `flutter test` only walks test/, so nothing
  # here is picked up by the unit suite.
  integration_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0
  drift_dev: ^2.34.5
  build_runner: ^2.15.1

  # Fans the three masters in assets/icon/ out to every Android density and
  # every iOS slot, and writes the adaptive-icon XML. Run through
  # tool/icons.sh; see docs/app-icon.md for what it is configured to do.
  flutter_launcher_icons: ^0.14.4

# The launcher icon. Regenerated by tool/icons.sh, never hand-edited: every file
# it writes under android/app/src/main/res/ and ios/Runner/Assets.xcassets/ comes
# from the three 1024 masters in assets/icon/.
#
# The background is a colour rather than an image because it is a flat field. A
# PNG of one colour would only add a file that can be resampled wrong.
#
# remove_alpha_ios flattens the iOS slots onto white if any alpha survives. The
# master has three channels and no alpha to begin with, so this is a belt on top
# of braces; the App Store rejects an icon with an alpha channel.
flutter_launcher_icons:
  image_path: "assets/icon/app_icon.png"
  android: true
  ios: true
  remove_alpha_ios: true
  min_sdk_android: 21
  adaptive_icon_background: "#1E3A2B"
  adaptive_icon_foreground: "assets/icon/app_icon_foreground.png"
  adaptive_icon_monochrome: "assets/icon/app_icon_monochrome.png"

  # The package otherwise wraps the foreground in a 16% inset, which would shrink
  # a mark already drawn to the safe zone to two thirds of the size it can be.
  # The safe-zone maths lives in generate_icon_sources.dart, written down beside
  # the number it produces, and it only works if nothing shrinks the layer again
  # on the way in.
  adaptive_icon_foreground_inset: 0

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # Manrope is bundled as static TTFs, never fetched at runtime. The app is
  # offline-only, so google_fonts would silently fall back to a system font.
  # Source: https://github.com/aaronbell/manrope (SIL OFL 1.1, see
  # assets/fonts/OFL.txt). Only the four weights the type scale uses are
  # bundled; add a file here before referencing a new FontWeight.
  fonts:
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope-Light.ttf
          weight: 300
        - asset: assets/fonts/Manrope-Regular.ttf
          weight: 400
        - asset: assets/fonts/Manrope-Medium.ttf
          weight: 500
        - asset: assets/fonts/Manrope-SemiBold.ttf
          weight: 600
